<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --c: #3f51b5; --bg: #f4f5fa; --card: #fff; --text: #222; --muted: #666; --line: #dde0ee; --ok: #2e7d32; --err: #c62828; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--c); color: #fff; padding: 14px 16px; }
  header .in, main { max-width: 760px; margin: 0 auto; }
  header h1 { margin: 0 0 8px; font-size: 20px; }
  nav a { color: #fff; opacity: .8; text-decoration: none; margin-right: 14px; font-size: 14px; white-space: nowrap; }
  nav a.on { opacity: 1; font-weight: bold; border-bottom: 2px solid #fff; }
  main { padding: 16px; }
  .card { background: var(--card); border-radius: 10px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h2 { margin: 0 0 12px; font-size: 18px; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
  label small { font-weight: normal; color: var(--muted); }
  input[type=text], input[type=email], input[type=date], select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  textarea { min-height: 80px; resize: vertical; }
  button { margin-top: 16px; background: var(--c); color: #fff; border: 0; padding: 10px 22px; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 6px; display: none; white-space: pre-wrap; }
  .msg.ok { display: block; background: #e8f5e9; color: var(--ok); }
  .msg.err { display: block; background: #ffebee; color: var(--err); }
  .msg a { color: inherit; }
  .muted { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .tile { display: block; background: var(--card); border-radius: 10px; padding: 16px; text-decoration: none; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); border-top: 4px solid var(--c); }
  .tile b { display: block; margin-bottom: 4px; }
  .next { font-size: 15px; line-height: 1.8; }
  .pres { border-left: 4px solid var(--c); background: #f5f6fb; padding: 6px 10px; margin: 6px 0; border-radius: 0 6px 6px 0; }
  .files { margin: 8px 0 0; padding-left: 20px; }
  .files li { margin: 4px 0; word-break: break-all; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 10px; background: #e8eaf6; color: var(--c); margin-right: 4px; }
  .cancel { color: var(--err); font-weight: bold; }
  .prog { margin-top: 10px; font-size: 14px; }
  .prog div { padding: 3px 0; word-break: break-all; }
  .hidden { display: none; }
  #search { margin-bottom: 14px; }
  .wt { width: 100%; border-collapse: collapse; font-size: 14px; }
  .wt th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); padding: 6px 4px; }
  .wt td { border-bottom: 1px solid var(--line); padding: 8px 4px; vertical-align: middle; }
  .bar { display: inline-block; width: 90px; height: 8px; background: #e8eaf6; border-radius: 4px; margin-right: 6px; vertical-align: middle; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--c); }
</style>
</head>
<body>
<header><div class="in">
  <h1 id="title"></h1>
  <nav id="nav"></nav>
</div></header>
<main id="app"></main>

<script>
/* ===== 後端（Apps Script 網頁應用程式）網址，部署新版本後若網址改變要更新這一行 ===== */
const EXEC_URL = 'https://script.google.com/macros/s/AKfycbx-FhsHVyMx2XC015LtPPkkYS2lfieg4jGbil3kXr6Tt02MduCpKiGzHEe1Wf4DPbgA/exec';

const QS = new URLSearchParams(location.search);
const SHELL = {
  page: QS.get('page') || 'home',
  url: location.origin + location.pathname,
  group: 'Group Meeting',
  admin: '',
  params: { date: QS.get('date') || '', name: QS.get('name') || '', topic: QS.get('topic') || '',
    action: QS.get('action') || '', backfill: QS.get('backfill') || '' },
  token: QS.get('token') || '', email: QS.get('email') || '',
};
let B = SHELL;   // 輸入驗證碼後換成完整資料
let CODE = '';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link = (page, q) => B.url + '?page=' + page + (q || '');
// 站內連結改成不重新載入整頁（避免重複輸入驗證碼）
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href]');
  if (!a || a.dataset.page || !B.url || a.href.indexOf(B.url) !== 0) return;
  const m = a.href.match(/[?&]page=([a-z]+)/);
  if (!m || /&(date|name|topic|action|backfill)=/.test(a.href)) return;
  e.preventDefault();
  go(m[1]);
});
const isCodeErr = m => /驗證碼錯誤|嘗試次數過多/.test(m || '');
function forgetCode() { try { sessionStorage.removeItem('gm_code'); } catch (e) {} }

/** 直接呼叫後端（不帶 Cookie，所以不會有多帳號問題） */
async function callApi(fn, args, code) {
  const body = JSON.stringify({ code: code === undefined ? CODE : code, fn, args });
  let data;
  try {
    const res = await fetch(EXEC_URL, {
      method: 'POST', redirect: 'follow', credentials: 'omit',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body,
    });
    data = await res.json();
  } catch (e) {
    data = await jsonp(fn, args, code === undefined ? CODE : code);   // 備援管道
  }
  if (!data || !data.ok) throw new Error((data && data.error) || '無法連線到伺服器，請稍後再試');
  return data.result;
}

/** 備援：用 <script> 取得結果（避開跨網域限制），只用於資料量小的呼叫 */
function jsonp(fn, args, code) {
  return new Promise((ok, fail) => {
    const cb = 'gmcb' + Math.random().toString(36).slice(2);
    const el = document.createElement('script');
    const done = v => { try { delete window[cb]; } catch (e) {} el.remove(); v instanceof Error ? fail(v) : ok(v); };
    window[cb] = done;
    el.onerror = () => done(new Error('無法連線到伺服器'));
    el.src = EXEC_URL + '?callback=' + cb + '&code=' + encodeURIComponent(code || '') +
      '&fn=' + encodeURIComponent(fn) + '&args=' + encodeURIComponent(JSON.stringify(args || []));
    if (el.src.length > 7000) return done(new Error('資料太大，請改用其他瀏覽器或稍後再試'));
    document.body.appendChild(el);
  });
}

const run = (fn, ...args) => callApi(fn, args).catch(err => {
  if (isCodeErr(err.message)) { forgetCode(); showGate(err.message); }
  throw err;
});

const PAGES = [
  ['home', '首頁'], ['schedule', '未來會議'], ['present', '報告登記'], ['upload', '上傳資料'], ['archive', '會議資料'],
  ['weights', '抽籤權重'], ['help', '說明'],
];

document.title = B.group;
$('title').textContent = B.group;
function renderNav() {
  $('nav').innerHTML = PAGES.map(([p, t]) => `<a href="${link(p)}" data-page="${p}" class="${p === B.page ? 'on' : ''}">${t}</a>`).join('');
  [...$('nav').querySelectorAll('a')].forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.page); });
}
renderNav();

/** 在同一頁內切換（不重新載入，驗證碼只需輸入一次） */
async function go(page) {
  B = Object.assign({}, B, { page, date: '', name: '', topic: '', action: '', backfill: '' });
  if ((page === 'present' || page === 'upload') && !B.foldersLoaded) {
    try {
      const boot = await run('getBoot', page, {});
      B = Object.assign({}, B, boot, { page, foldersLoaded: true });
    } catch (e) { return; }
  }
  renderNav();
  (render[page] || render.home)();
}

function msg(el, text, ok) { el.className = 'msg ' + (ok ? 'ok' : 'err'); el.innerHTML = text; }

function meetingLine(m) {
  if (!m) return '';
  if (m.cancelled) return `${esc(m.label)} <span class="cancel">（取消）</span>`;
  return `${esc(m.label)} ${esc(m.start)}–${esc(m.end)} @ ${esc(m.location)}`;
}

/** 會議日期下拉選單（含「其他日期」） */
function dateSelect(id, list, selected) {
  const sel = selected && list.some(m => m.date === selected) ? selected : (selected ? '__other' : (list[0] || {}).date);
  const opts = list.map(m => `<option value="${m.date}" ${m.date === sel ? 'selected' : ''}>${esc(m.label)}${m.cancelled ? '（取消）' : ''}${m.presenters.length ? '｜' + esc(m.presenters.map(p => p.name).join('、')) : ''}</option>`).join('');
  return `<select id="${id}">${opts}<option value="__other" ${sel === '__other' ? 'selected' : ''}>其他日期…</option></select>
    <input type="date" id="${id}_other" class="${sel === '__other' ? '' : 'hidden'}" style="margin-top:6px" value="${sel === '__other' ? esc(selected) : ''}">`;
}
function bindDateSelect(id, onChange) {
  $(id).addEventListener('change', () => { $(id + '_other').classList.toggle('hidden', $(id).value !== '__other'); onChange && onChange(); });
  $(id + '_other').addEventListener('change', () => onChange && onChange());
}
function dateVal(id) { return $(id).value === '__other' ? $(id + '_other').value : $(id).value; }

function readB64(file) {
  return new Promise((ok, fail) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(',')[1] || '');
    r.onerror = () => fail(r.error);
    r.readAsDataURL(file);
  });
}

/** 個人資料夾選單（可自行建立新資料夾） */
function folderPicker(id) {
  if (B.folderError) return `<div class="msg err" style="display:block">${esc(B.folderError)}</div><select id="${id}" class="hidden"></select>`;
  return `<select id="${id}">
      <option value="">— 請選擇以你名字命名的資料夾 —</option>
      ${B.folders.map(f => `<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('')}
      <option value="__new">＋ 沒有我的資料夾，建立一個新的…</option>
    </select>
    <input type="text" id="${id}_name" class="hidden" style="margin-top:6px" placeholder="新資料夾名稱（通常是你的名字）">`;
}
function bindFolderPicker(id, nameInput) {
  const sel = $(id);
  const auto = () => { // 依輸入的姓名自動選擇同名資料夾
    if (sel.value) return;
    const n = nameInput.value.trim().toLowerCase();
    const f = B.folders.find(f => f.name.trim().toLowerCase() === n);
    if (f) sel.value = f.id;
  };
  sel.addEventListener('change', () => {
    $(id + '_name').classList.toggle('hidden', sel.value !== '__new');
    if (sel.value === '__new' && !$(id + '_name').value) $(id + '_name').value = nameInput.value.trim();
  });
  nameInput.addEventListener('change', auto);
  auto();
}
/** 取得所選資料夾 ID；若選「建立新的」就先建立 */
async function resolveFolder(id) {
  const sel = $(id);
  if (sel.value === '__new') {
    const r = await run('createPersonFolder', $(id + '_name').value);
    if (!B.folders.some(f => f.id === r.id)) {
      B.folders.push(r);
      sel.insertBefore(new Option(r.name, r.id), sel.querySelector('option[value="__new"]'));
    }
    sel.value = r.id;
    $(id + '_name').classList.add('hidden');
    return r.id;
  }
  if (!sel.value) throw new Error('請選擇你的個人資料夾');
  return sel.value;
}

/** 逐一上傳檔案並顯示進度（先問伺服器是否已有同一檔案，有就不重複上傳） */
async function uploadAll(files, meta, progEl) {
  const results = [];
  for (const f of files) {
    const row = document.createElement('div');
    row.textContent = '⏳ ' + f.name;
    progEl.appendChild(row);
    try {
      const base = Object.assign({}, meta, { fileName: f.name, size: f.size, mimeType: f.type || 'application/octet-stream' });
      let r = await run('uploadFile', base);
      if (r.needData) {
        if (f.size > B.maxMb * 1024 * 1024) {
          row.textContent = `✖ ${f.name}：超過 ${B.maxMb} MB，請壓縮後再上傳，或直接放到雲端資料夾`;
          continue;
        }
        r = await run('uploadFile', Object.assign(base, { data: await readB64(f) }));
      }
      row.innerHTML = (r.duplicate ? '↺ 已存在，未重複上傳：' : '✔ ') +
        `<a href="${esc(r.url)}" target="_blank">${esc(r.name)}</a> <span class="muted">（${esc(r.folder)}，並已連結到 <a href="${esc(r.dateFolderUrl)}" target="_blank">${esc(meta.date)}</a>）</span>`;
      results.push(r);
    } catch (e) {
      row.textContent = `✖ ${f.name}：${e.message}`;
    }
  }
  return results;
}

/* ---------------- 頁面 ---------------- */

const render = {
  home() {
    const n = B.upcoming[0];
    $('app').innerHTML = `
      <div class="card next">
        <h2>下次會議</h2>
        ${n ? `<div>${meetingLine(n)}</div>
          ${n.presenters.length ? n.presenters.map(p => `<div class="pres"><b>${esc(p.name)}</b>：${esc(p.topic)}</div>`).join('')
            : `<div class="muted">尚無人登記報告　<a href="${link('present', '&date=' + n.date)}">我要登記</a></div>`}` : '<div class="muted">尚無排定的會議</div>'}
      </div>
      <div class="grid">
        <a class="tile" href="${link('present')}"><b>📝 報告登記</b><span class="muted">登記或取消報告、填寫主題</span></a>
        <a class="tile" href="${link('upload')}"><b>📤 上傳資料</b><span class="muted">報告投影片、參考資料等，會前會後都在這裡上傳</span></a>
        <a class="tile" href="${link('archive')}"><b>📂 會議資料</b><span class="muted">瀏覽歷次會議的報告與檔案</span></a>
        <a class="tile" href="${link('schedule')}"><b>🗓 未來會議</b><span class="muted">未來每次會議的時間、地點與預計報告者</span></a>
        <a class="tile" href="${link('weights')}"><b>🎲 抽籤權重</b><span class="muted">沒人登記時依權重抽籤，看看每個人的權重</span></a>
        <a class="tile" href="${link('help')}"><b>📖 說明</b><span class="muted">這個系統怎麼運作：登記、抽籤、權重、上傳的所有規則</span></a>
      </div>`;
  },

  subscribe() {
    $('app').innerHTML = `<div class="card"><h2>加入通知名單</h2>
      <p>新成員請聯絡管理者加入通知名單。加入後會收到歡迎信，之後每次會議前都會收到通知。</p></div>`;
  },

  present() {
    const regs = [];
    B.upcoming.forEach(m => m.presenters.filter(p => p.name).forEach(p => regs.push({ date: m.date, label: m.label, name: p.name, topic: p.topic, drawn: p.drawn, alone: m.presenters.filter(x => x.name).length < 2 })));
    const manageFirst = ['cancel', 'move', 'manage'].includes(B.action);
    const mode0 = B.action === 'cancel' ? 'cancel' : 'move';
    const openDates = B.upcoming.filter(m => !m.cancelled);
    const cancelCard = `
      <div class="card">
        <h2>改期或取消已登記的報告</h2>
        <p class="muted">選擇要修改的登記，並輸入登記時填的 Email 確認身分。改期或取消都不影響抽籤權重（權重只在實際報告後才歸 0）。</p>
        ${regs.length ? `<form id="cf">
          <label>要修改的登記</label>
          <select id="creg">${regs.map((r, i) => `<option value="${i}" ${r.date === B.date && r.name === B.name ? 'selected' : ''}>${esc(r.label)}｜${esc(r.name)}${r.topic ? '：' + esc(r.topic) : ''}${r.drawn ? (r.alone ? '（抽籤，暫時不能修改）' : '（抽籤，同場已有人登記，可修改）') : ''}</option>`).join('')}</select>
          <label>要做什麼</label>
          <select id="cmode">
            <option value="move" ${mode0 === 'move' ? 'selected' : ''}>改到其他日期</option>
            <option value="cancel" ${mode0 === 'cancel' ? 'selected' : ''}>取消這次報告</option>
          </select>
          <div id="cmovewrap"><label>改到哪一天</label>
            <select id="cnew">${openDates.map(m => `<option value="${m.date}">${esc(m.label)}${m.presenters.length ? '｜' + esc(m.presenters.map(p => p.name).join('、')) : '（尚無人報告）'}</option>`).join('')}</select></div>
          <label>登記時填的 Email</label><input type="email" id="cemail" required>
          <button id="cbtn">確認</button>
        </form>` : '<p class="muted">目前沒有已登記的報告。</p>'}
        <div id="cmsg" class="msg"></div>
      </div>`;
    $('app').innerHTML = (manageFirst ? cancelCard : '') + `
      <div class="card">
        <h2>${B.backfill ? '補登報告' : '報告登記'}</h2>
        ${B.backfill ? '<p class="msg ok" style="display:block">這是補登連結：請填寫您當天報告的主題等資訊並送出，送出後才會算您在這場會議報告過。</p>' : ''}
        <p class="muted">資料還沒準備好也沒關係：可以先只填姓名、Email 登記日期，之後再用同樣的姓名回來補主題、摘要（留空的欄位不會清掉原本的內容），
          或之後到「<a href="${link('upload')}">上傳資料</a>」頁上傳資料。</p>
        <form id="f">
          <label>會議日期</label>${B.backfill && B.date
            ? `<select id="date"><option value="${B.date}">${esc((B.recent.find(m => m.date === B.date) || {}).label || B.date)}</option></select>
               <input type="date" id="date_other" class="hidden">`
            : dateSelect('date', B.upcoming, B.date)}
          <label>報告者姓名</label><input type="text" id="name" value="${esc(B.name)}" required>
          <label>報告者 Email <small>（姓名與 Email 都要和通知名單上的相同）</small></label><input type="email" id="email" required>
          <label>報告主題 <small>（還沒決定可以先留空）</small></label><input type="text" id="topic" value="${esc(B.topic)}">
          <label>摘要 <small>（選填）</small></label><textarea id="abstract"></textarea>
          <label>參考資料連結 <small>（選填，一行一個網址，例如論文連結）</small></label><textarea id="refs" placeholder="https://..."></textarea>
          <label>上傳資料 <small>（選填，可多選，每個檔案上限 ${B.maxMb} MB）</small></label><input type="file" id="files" multiple>
          <div id="fwrap" class="hidden">
            <label>上傳到哪個個人資料夾</label>${folderPicker('folder')}
          </div>
          <button id="btn">送出登記</button>
        </form>
        <div id="msg" class="msg"></div><div id="prog" class="prog"></div>
      </div>` + (manageFirst ? '' : cancelCard);
    bindDateSelect('date');
    if ($('cf')) {
      let armed = false;
      const sync = () => {
        armed = false;
        const cancel = $('cmode').value === 'cancel';
        $('cmovewrap').classList.toggle('hidden', cancel);
        $('cbtn').textContent = cancel ? '取消這筆登記' : '改到這一天';
        $('cbtn').style.background = cancel ? '#c62828' : '';
      };
      ['creg', 'cmode', 'cnew'].forEach(id => $(id).addEventListener('change', sync));
      sync();
      $('cf').onsubmit = async e => {
        e.preventDefault();
        if (!armed) { armed = true; $('cbtn').textContent = '確定？再按一次'; return; }
        const r = regs[Number($('creg').value)];
        if (!r) return;
        $('cbtn').disabled = true;
        try {
          if ($('cmode').value === 'cancel') {
            const res = await run('cancelPresentation', { date: r.date, name: r.name, email: $('cemail').value });
            msg($('cmsg'), `已取消 ${esc(r.name)} 在 ${esc(res.label)} 的報告登記，確認信已寄出。`, true);
          } else {
            const res = await run('movePresentation', { date: r.date, name: r.name, email: $('cemail').value, newDate: $('cnew').value });
            msg($('cmsg'), `已將 ${esc(r.name)} 的報告從 ${esc(r.label)} 改到 ${esc(res.label)}，確認信已寄出。`, true);
          }
          $('creg').querySelector(`option[value="${$('creg').value}"]`).remove();
        } catch (err) { msg($('cmsg'), esc(err.message)); }
        $('cbtn').disabled = false;
        sync();
      };
    }
    bindFolderPicker('folder', $('name'));
    $('files').addEventListener('change', () => $('fwrap').classList.toggle('hidden', !$('files').files.length));
    $('f').onsubmit = async e => {
      e.preventDefault();
      const date = dateVal('date');
      if (!date) return msg($('msg'), '請選擇會議日期');
      const files = [...$('files').files];
      if (files.length && !$('folder').value) return msg($('msg'), '要上傳檔案，請先選擇你的個人資料夾');
      $('btn').disabled = true; $('prog').innerHTML = ''; $('msg').className = 'msg';
      try {
        const form = { date, name: $('name').value, email: $('email').value, topic: $('topic').value, abstract: $('abstract').value, refs: $('refs').value, backfill: B.backfill };
        const folderId = files.length ? await resolveFolder('folder') : '';
        const r = await run('registerPresentation', form);
        msg($('msg'), `已完成 ${esc(r.label)} 的報告登記！確認信已寄到您的信箱。`, true);
        if (files.length) {
          await uploadAll(files, { date, uploader: form.name, topic: form.topic, description: '', folderId }, $('prog'));
          $('files').value = '';
        }
      } catch (err) { msg($('msg'), esc(err.message)); }
      $('btn').disabled = false;
    };
  },

  upload() {
    const all = B.recent.concat(B.upcoming.filter(u => !B.recent.some(r => r.date === u.date)))
      .sort((a, b) => b.date.localeCompare(a.date));
    const def = B.date || (B.recent[0] || B.upcoming[0] || {}).date;
    $('app').innerHTML = `
      <div class="card">
        <h2>上傳資料</h2>
        <p class="muted">檔案會存到你的個人資料夾，檔名自動為「上傳者_主題_日期_原檔名」，並在 Group Meeting Details／該次會議日期資料夾中建立連結。已上傳過的相同檔案不會重複上傳。</p>
        <form id="f">
          <label>會議日期</label>${dateSelect('date', all, def)}
          <label>上傳者姓名</label><input type="text" id="name" list="names" value="${esc(B.name)}" required>
          <datalist id="names"></datalist>
          <label>你的個人資料夾</label>${folderPicker('folder')}
          <label>相關報告主題 <small>（選填）</small></label><input type="text" id="topic" list="topics" value="${esc(B.topic)}">
          <datalist id="topics"></datalist>
          <label>說明 <small>（選填）</small></label><input type="text" id="desc">
          <label>檔案 <small>（可多選，每個檔案上限 ${B.maxMb} MB）</small></label><input type="file" id="files" multiple required>
          <button id="btn">上傳</button>
        </form>
        <div id="msg" class="msg"></div><div id="prog" class="prog"></div>
      </div>`;
    const fill = () => {
      const m = all.find(x => x.date === dateVal('date'));
      const ps = m ? m.presenters : [];
      $('names').innerHTML = ps.map(p => `<option value="${esc(p.name)}">`).join('');
      $('topics').innerHTML = ps.map(p => `<option value="${esc(p.topic)}">`).join('');
    };
    bindDateSelect('date', fill); fill();
    bindFolderPicker('folder', $('name'));
    $('name').addEventListener('change', () => {
      const m = all.find(x => x.date === dateVal('date'));
      const p = m && m.presenters.find(p => p.name === $('name').value.trim());
      if (p && !$('topic').value) $('topic').value = p.topic;
    });
    $('f').onsubmit = async e => {
      e.preventDefault();
      const date = dateVal('date');
      if (!date) return msg($('msg'), '請選擇會議日期');
      const files = [...$('files').files];
      if (!files.length) return msg($('msg'), '請選擇檔案');
      $('btn').disabled = true; $('prog').innerHTML = ''; $('msg').className = 'msg';
      let folderId;
      try { folderId = await resolveFolder('folder'); }
      catch (err) { $('btn').disabled = false; return msg($('msg'), esc(err.message)); }
      const ok = await uploadAll(files, { date, uploader: $('name').value, topic: $('topic').value, description: $('desc').value, folderId }, $('prog'));
      msg($('msg'), `完成：${ok.length}/${files.length} 個檔案上傳成功。<a href="${link('archive')}">查看會議資料</a>`, ok.length === files.length);
      $('files').value = '';
      $('btn').disabled = false;
    };
  },

      (people.length ? `<table class="wt">
      <tr><th>姓名</th><th>上次報告</th><th style="text-align:right">權重</th><th>下次被抽中機率</th></tr>
      ${people.map(p => `<tr>
        <td>${esc(p.name)}${p.pending ? ' <span class="tag">待補報告</span>' : ''}</td>
        <td class="muted">${esc(p.last || '尚未報告')}</td>
        <td style="text-align:right;font-variant-numeric:tabular-nums"><b>${p.weight}</b>${p.penalty ? `<br><span class="muted">含未做記錄 +${p.penalty}</span>` : ''}</td>
        <td>${p.scheduled ? `<span class="tag">已排定 ${esc(p.scheduled)}</span>`
          : `<div class="bar"><span style="width:${(p.weight / max * 100).toFixed(1)}%"></span></div><span class="muted">${(p.prob * 100).toFixed(1)}%</span>`}</td>
      </tr>`).join('')}</table>` : '<div class="muted">抽籤池目前沒有人</div>');
  },

  async archive() {
    $('app').innerHTML = `<input type="text" id="search" placeholder="搜尋日期、報告者、主題、檔名…"><div id="list" class="muted">載入中…</div>`;
    let data;
    try { data = await run('getArchive'); }
    catch (e) { $('list').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
    const draw = () => {
      const q = $('search').value.trim().toLowerCase();
      const shown = data.filter(m => !q || JSON.stringify(m).toLowerCase().includes(q));
      $('list').className = '';
      $('list').innerHTML = shown.length ? shown.map(m => `
        <div class="card">
          <h2>${esc(m.label)} ${m.cancelled ? '<span class="cancel">取消</span>' : `<span class="muted">${esc(m.start)}–${esc(m.end)} @ ${esc(m.location)}</span>`}</h2>
          ${m.presenters.map(p => `<div class="pres"><b>${esc(p.name)}</b>${p.noShow ? ' <span class="tag">實際未報告</span>' : ''}：${esc(p.topic)}
            ${p.refs ? `<div class="muted">${p.refs.split(/\s+/).filter(Boolean).map(u => /^https?:/i.test(u) ? `<a href="${esc(u)}" target="_blank">${esc(u)}</a>` : esc(u)).join('<br>')}</div>` : ''}</div>`).join('')}
          ${m.note ? `<div class="muted">備註：${esc(m.note)}</div>` : ''}
          ${m.files.length ? `<ul class="files">${m.files.map(f => `<li><a href="${esc(f.url)}" target="_blank">${esc(f.name)}</a>
              <span class="muted">— ${esc(f.uploader)}${f.desc ? '，' + esc(f.desc) : ''}</span></li>`).join('')}</ul>`
            : '<div class="muted">尚無上傳檔案</div>'}
          <div style="margin-top:8px"><a href="${link('upload', '&date=' + m.date)}">＋ 上傳檔案到這場會議</a></div>
        </div>`).join('') : '<div class="muted">沒有符合的資料</div>';
    };
    $('search').addEventListener('input', draw);
    draw();
  },
};

/* ---------------- 驗證碼 ---------------- */

function showGate(err) {
  $('app').innerHTML = `
    <div class="card" style="max-width:420px;margin:40px auto">
      <h2>🔑 請輸入驗證碼</h2>
      <p class="muted">驗證碼附在每次的會議通知信中（每次會議更新）。沒有收到信或找不到驗證碼，請向管理者索取${SHELL.admin ? '：<br>' + esc(SHELL.admin) : ''}。</p>
      <form id="gf">
        <input type="text" id="gcode" autocomplete="off" autocapitalize="characters" spellcheck="false"
          style="text-transform:uppercase;letter-spacing:4px;font-size:20px;text-align:center" required>
        <button id="gbtn" style="width:100%">進入</button>
      </form>
      <div class="msg ${err ? 'err' : ''}">${esc(err || '')}</div>
    </div>`;
  $('gf').onsubmit = e => { e.preventDefault(); enter($('gcode').value.trim().toUpperCase()); };
  $('gcode').focus();
}

async function enter(code) {
  CODE = code;
  if ($('gbtn')) $('gbtn').disabled = true;
  try {
    const boot = await callApi('getBoot', [SHELL.page, SHELL.params], code);
    try { sessionStorage.setItem('gm_code', code); } catch (e) {}  // 同一個分頁切換頁面時不用重打；關掉分頁就要重新輸入
    B = Object.assign({}, SHELL, boot, { url: SHELL.url });   // 連結一律指向這個網站
    renderNav();
    (render[B.page] || render.home)();
  } catch (e) {
    forgetCode();
    showGate(e && e.message ? e.message : String(e));
  }
}

/* ---------------- 啟動 ---------------- */

/* 信件連結：取消訂閱／婉拒會議記錄（用信裡的 token，不需要驗證碼） */

async function tokenPage(kind) {
  const label = kind === 'unsubscribe' ? '取消訂閱' : '婉拒會議記錄';
  if (!SHELL.token || !SHELL.email) {
    $('app').innerHTML = `<div class="card"><h2>連結無效</h2><p>請改用信件中的連結，或聯絡管理者。</p></div>`;
    return;
  }
  const dateTxt = SHELL.params.date ? esc(SHELL.params.date) + ' 的' : '';
  $('app').innerHTML = `
    <div class="card" style="max-width:460px;margin:30px auto;text-align:center">
      <h2>${label}</h2>
      <p>${kind === 'unsubscribe'
        ? `確定要讓 ${esc(SHELL.email)} 不再收到會議通知嗎？`
        : `確定要婉拒擔任 ${dateTxt}會議記錄嗎？系統會立刻換下一位並寄信通知他。`}</p>
      <button id="tb" style="background:#c62828">確定${label}</button>
      <div id="tm" class="msg"></div>
    </div>`;
  $('tb').onclick = async () => {
    $('tb').disabled = true;
    try {
      const r = kind === 'unsubscribe'
        ? await callApi('unsubscribe', [SHELL.email, SHELL.token], '')
        : await callApi('declineNoter', [SHELL.params.date, SHELL.email, SHELL.token], '');
      msg($('tm'), esc(r.msg), true);
    } catch (e) { msg($('tm'), esc(e.message)); $('tb').disabled = false; }
  };
}

if (SHELL.page === 'unsubscribe' || SHELL.page === 'noter') {
  tokenPage(SHELL.page);
} else {
  let saved = '';
  try { saved = sessionStorage.getItem('gm_code') || ''; } catch (e) {}
  if (saved) { $('app').innerHTML = '<div class="muted">載入中…</div>'; enter(saved); }
  else showGate('');
}


</script>
</body>
</html>
